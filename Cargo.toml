[workspace]
members = ["crates/symweft-core", "crates/symweft-analysis", "crates/symweft-index", "crates/symweft-semantic"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

